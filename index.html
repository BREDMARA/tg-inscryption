<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bar — Prologue</title>
  <style>
    html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; }
    canvas { width:100%; height:100%; image-rendering:pixelated; display:block; }

    #subtitle{
      position:absolute; left:0; right:0; bottom:18px;
      text-align:center; color:#d8d8d8; font-family:serif;
      text-shadow:0 0 8px #000; pointer-events:none; padding:0 16px;
      user-select:none; line-height:1.35; opacity:0.95;
    }

    #overlay{
      position:absolute; inset:0; display:none;
      align-items:center; justify-content:center;
      background:rgba(0,0,0,0.55);
      color:#d8d8d8; font-family:serif; text-shadow:0 0 8px #000;
      padding:24px;
    }
    #panel{
      width:min(780px, calc(100vw - 32px));
      padding:18px;
      border:1px solid rgba(255,255,255,0.15);
      background:rgba(0,0,0,0.45);
    }
    .title{ margin:0 0 10px; font-size:18px; opacity:0.95; }
    .choice{
      margin-top:10px; padding:10px 12px;
      border:1px solid rgba(255,255,255,0.22);
      background:rgba(255,255,255,0.04);
      cursor:pointer; user-select:none;
    }
    .choice:hover{ background:rgba(255,255,255,0.08); }
    .hint{ margin-top:10px; opacity:0.75; font-size:13px; }
  </style>
</head>
<body>

<canvas id="game"></canvas>
<div id="subtitle">Ты заходишь в бар. Шум, смех, пиво.</div>

<div id="overlay">
  <div id="panel"></div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const subtitle = document.getElementById("subtitle");
const overlay = document.getElementById("overlay");
const panel = document.getElementById("panel");

function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener("resize", resize);
resize();

/*
  Карта 8x8:
  1 = стена
  0 = пусто
  2 = стойка (тоже как "стена" для лучей, чтобы она была видна)
*/
const map = [
  "11111111",
  "10022001", // стойка вдоль стены (две клетки)
  "10000001",
  "10000001",
  "10000001",
  "10000001",
  "10000001",
  "11111111"
];

let px = 4.0;
let py = 6.0;
let pa = -Math.PI/2;

const STATE = { PLAY:"play", TURN:"turn", DIALOG:"dialog" };
let state = STATE.PLAY;

let triggered = false;
let targetAngle = pa;

// 🎭 точки в мире
const BAR = { x: 4.0, y: 1.2 };       // центр стойки (можешь двигать)
const STRANGER = { x: 1.6, y: 2.0 };  // точка "незнакомец в углу" (можешь двигать)

function resizeFix(){ /* just in case */ }
resizeFix();

function isBlockChar(ch){
  return (ch === "1" || ch === "2");
}

function isWall(x,y){
  const mx = Math.floor(x), my = Math.floor(y);
  if (my<0||my>=map.length||mx<0||mx>=map[0].length) return true;
  return isBlockChar(map[my][mx]);
}

const keys = {};
addEventListener("keydown", (e) => {
  keys[e.code] = true;

  // выбор 1/2 с клавы, когда диалог открыт
  if (state === STATE.DIALOG){
    if (e.code === "Digit1") choose(1);
    if (e.code === "Digit2") choose(2);
  }
});
addEventListener("keyup", e => keys[e.code]=false);

function lerpAngle(a,b,t){
  let d = b - a;
  while (d > Math.PI) d -= Math.PI*2;
  while (d < -Math.PI) d += Math.PI*2;
  return a + d*t;
}

function angleDiff(a, b){
  let d = b - a;
  while (d > Math.PI) d -= Math.PI*2;
  while (d < -Math.PI) d += Math.PI*2;
  return Math.abs(d);
}

// ✅ ТРИГГЕР: только если ты подошёл СПЕРЕДИ и смотришь на стойку
function nearBarCounter(){
  const dx = BAR.x - px;
  const dy = BAR.y - py;
  const dist = Math.hypot(dx, dy);

  const lookToBar = Math.atan2(dy, dx);
  const diff = angleDiff(pa, lookToBar);

  // настройка "2–3 шага" и "смотрит в стойку"
  const DIST_TRIGGER = 1.35;  // 1.2–1.6 (увеличь если сложно поймать)
  const VIEW_CONE = 0.55;     // 0.35–0.7 (меньше = строже)

  // "спереди" = игрок ниже стойки по Y (не за ней)
  const inFront = py > BAR.y + 0.6;

  return dist < DIST_TRIGGER && diff < VIEW_CONE && inFront;
}

function openOverlay(){
  panel.innerHTML = `
    <div class="title">— Эй. Ты.<br>— Сыграем?</div>
    <div class="choice" data-c="1">1) Подойти к незнакомцу</div>
    <div class="choice" data-c="2">2) Пойти пить пиво</div>
    <div class="hint">Нажми 1 или 2.</div>
  `;
  overlay.style.display = "flex";

  panel.querySelectorAll(".choice").forEach(el=>{
    el.addEventListener("click", ()=>{
      choose(Number(el.dataset.c));
    });
  });
}

function closeOverlay(){
  overlay.style.display = "none";
}

function choose(n){
  if (n === 1){
    subtitle.textContent = "Ты подходишь к незнакомцу...";
  } else {
    subtitle.textContent = "Ты идёшь пить пиво. Иногда лучший выбор — не играть.";
  }
  closeOverlay();
  // пока просто оставляем в диалоге (или можно перезапуск/конец)
}

function update(dt){
  const move = 3.0*dt;
  const rot = 1.7*dt;

  if (state === STATE.PLAY){
    // движение
    if (keys["KeyW"] || keys["ArrowUp"]){
      const nx = px + Math.cos(pa)*move;
      const ny = py + Math.sin(pa)*move;
      if (!isWall(nx,ny)) { px = nx; py = ny; }
    }
    if (keys["KeyS"] || keys["ArrowDown"]){
      const nx = px - Math.cos(pa)*move;
      const ny = py - Math.sin(pa)*move;
      if (!isWall(nx,ny)) { px = nx; py = ny; }
    }
    if (keys["KeyA"] || keys["ArrowLeft"]) pa -= rot;
    if (keys["KeyD"] || keys["ArrowRight"]) pa += rot;

    // триггер
    if (!triggered && nearBarCounter()){
      triggered = true;
      state = STATE.TURN;

      // ✅ поворот всегда на точку незнакомца (не "влево", а куда надо)
      targetAngle = Math.atan2(STRANGER.y - py, STRANGER.x - px);

      subtitle.textContent = "Кто-то окликает тебя из угла...";
    }
  }

  if (state === STATE.TURN){
    pa = lerpAngle(pa, targetAngle, dt*3.2);
    if (Math.abs(pa - targetAngle) < 0.02){
      state = STATE.DIALOG;
      openOverlay();
    }
  }
}

function render(){
  const w = canvas.width, h = canvas.height;

  // потолок / пол
  ctx.fillStyle = "#0f0f0f";
  ctx.fillRect(0,0,w,h/2);
  ctx.fillStyle = "#050505";
  ctx.fillRect(0,h/2,w,h/2);

  // raycast
  for (let x=0; x<w; x++){
    const angle = pa + (x/w - 0.5);
    let dist = 0;
    let hitChar = "0";

    while (dist < 20){
      const rx = px + Math.cos(angle)*dist;
      const ry = py + Math.sin(angle)*dist;

      const mx = Math.floor(rx), my = Math.floor(ry);
      if (my<0||my>=map.length||mx<0||mx>=map[0].length){ hitChar="1"; break; }

      const cell = map[my][mx];
      if (isBlockChar(cell)){ hitChar = cell; break; }

      dist += 0.04;
    }

    if (dist < 0.35) dist = 0.35;

    const wallH = h/(dist+0.1);

    // немного разный цвет для стен и стойки
    let shade = 185 - dist*12;
    shade = Math.max(40, Math.min(200, shade));

    if (hitChar === "2"){
      // стойка чуть темнее
      shade = Math.max(35, shade - 25);
    }

    ctx.fillStyle = `rgb(${shade},${shade},${shade})`;
    ctx.fillRect(x, h/2 - wallH/2, 1, wallH);
  }

  // крестик-прицел
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  ctx.fillRect(w/2 - 6, h/2, 12, 1);
  ctx.fillRect(w/2, h/2 - 6, 1, 12);
}

let last = performance.now();
function loop(t){
  const dt = (t-last)/1000;
  last = t;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
loop(last);
</script>

</body>
</html>
