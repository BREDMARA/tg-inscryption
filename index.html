<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bar — Prologue</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      display: block;
    }
    #subtitle {
      position: absolute;
      bottom: 18px;
      left: 0;
      right: 0;
      text-align: center;
      color: #d8d8d8;
      font-family: serif;
      text-shadow: 0 0 8px black;
      pointer-events: none;
      padding: 0 16px;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
      color: #d8d8d8;
      font-family: serif;
      text-shadow: 0 0 8px black;
    }
    #panel {
      max-width: 720px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.45);
    }
    .choice {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      cursor: pointer;
    }
    .choice:hover {
      background: rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>

<canvas id="game"></canvas>
<div id="subtitle">Ты заходишь в бар. Шум, смех, пиво.</div>

<div id="overlay">
  <div id="panel">
    <div style="margin-bottom:12px;">
      — Эй. Ты.<br>— Сыграем?
    </div>
    <div class="choice" id="c1">1) Подойти к незнакомцу</div>
    <div class="choice" id="c2">2) Пойти пить пиво</div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const subtitle = document.getElementById("subtitle");
const overlay = document.getElementById("overlay");

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
addEventListener("resize", resize);
resize();

/*
  Карта:
  - внешние стены
  - стойка: небольшая, по центру, вдоль верхней стены
*/
const map = [
  "11111111",
  "10011001", // ← стойка
  "10000001",
  "10000001",
  "10000001",
  "10000001",
  "10000001",
  "11111111"
];

let px = 4.0;
let py = 5.5;
let pa = -Math.PI / 2;

function isWall(x, y) {
  const mx = Math.floor(x);
  const my = Math.floor(y);
  if (my < 0 || my >= map.length || mx < 0 || mx >= map[0].length) return true;
  return map[my][mx] === "1";
}

// триггер — вплотную к стойке
let triggered = false;
function nearBarCounter() {
  return py < 2.3 && px > 3.2 && px < 4.8;
}

const keys = {};
addEventListener("keydown", e => keys[e.code] = true);
addEventListener("keyup", e => keys[e.code] = false);

function update(dt) {
  const move = 3 * dt;
  const rot = 1.7 * dt;

  if (keys["KeyW"] || keys["ArrowUp"]) {
    const nx = px + Math.cos(pa) * move;
    const ny = py + Math.sin(pa) * move;
    if (!isWall(nx, ny)) { px = nx; py = ny; }
  }
  if (keys["KeyS"] || keys["ArrowDown"]) {
    const nx = px - Math.cos(pa) * move;
    const ny = py - Math.sin(pa) * move;
    if (!isWall(nx, ny)) { px = nx; py = ny; }
  }
  if (keys["KeyA"] || keys["ArrowLeft"]) pa -= rot;
  if (keys["KeyD"] || keys["ArrowRight"]) pa += rot;

  if (!triggered && nearBarCounter()) {
    triggered = true;
    overlay.style.display = "flex";
    subtitle.textContent = "В углу сидит человек в плаще.";
  }
}

function render() {
  const w = canvas.width;
  const h = canvas.height;

  // потолок / пол
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(0, 0, w, h/2);
  ctx.fillStyle = "#070707";
  ctx.fillRect(0, h/2, w, h/2);

  for (let x = 0; x < w; x++) {
    const angle = pa + (x / w - 0.5);
    let dist = 0;

    while (dist < 20) {
      const rx = px + Math.cos(angle) * dist;
      const ry = py + Math.sin(angle) * dist;
      if (isWall(rx, ry)) break;
      dist += 0.04;
    }

    if (dist < 0.35) dist = 0.35;

    const wallH = h / (dist + 0.1);
    const shade = 180 - dist * 12;
    ctx.fillStyle = `rgb(${shade},${shade},${shade})`;

    ctx.fillRect(x, h/2 - wallH/2, 1, wallH);
  }

  // крестик
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  ctx.fillRect(w/2 - 6, h/2, 12, 1);
  ctx.fillRect(w/2, h/2 - 6, 1, 12);
}

let last = performance.now();
function loop(t) {
  const dt = (t - last) / 1000;
  last = t;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
loop(last);
</script>

</body>
</html>
