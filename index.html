<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Bar — Prologue</title>
  <style>
    html, body { margin:0; padding:0; background:#000; height:100%; overflow:hidden; }
    canvas { width:100%; height:100%; image-rendering: pixelated; display:block; }

    /* субтитры снизу */
    #subtitle {
      position:absolute;
      left:0; right:0; bottom:18px;
      text-align:center;
      color:#d8d8d8;
      font-family: serif;
      font-size: 16px;
      text-shadow: 0 0 8px #000;
      pointer-events:none;
      opacity:0.95;
    }

    /* меню выбора */
    #ui {
      position:absolute;
      left:50%; top:50%;
      transform:translate(-50%,-50%);
      width:min(760px, 92vw);
      background: rgba(0,0,0,0.55);
      border:1px solid rgba(255,255,255,0.18);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.6) inset;
      color:#d8d8d8;
      font-family: serif;
      padding:18px 18px 14px;
      display:none;
    }
    #ui .line { margin:0 0 10px; white-space:pre-line; }
    .choice {
      width:100%;
      text-align:left;
      font-family: serif;
      font-size: 16px;
      color:#d8d8d8;
      background: rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.15);
      padding:10px 12px;
      margin:8px 0;
      cursor:pointer;
    }
    .choice:hover { background: rgba(255,255,255,0.10); }
    #hint { margin-top:8px; opacity:0.8; font-size: 13px; }

    /* крестик */
    #crosshair {
      position:absolute;
      left:50%; top:50%;
      transform:translate(-50%,-50%);
      width:18px; height:18px;
      pointer-events:none;
      opacity:0.7;
    }
    #crosshair:before, #crosshair:after {
      content:"";
      position:absolute;
      background:#cfcfcf;
      box-shadow: 0 0 8px rgba(0,0,0,0.65);
    }
    #crosshair:before { left:50%; top:0; width:2px; height:18px; transform:translateX(-50%); }
    #crosshair:after  { top:50%; left:0; width:18px; height:2px; transform:translateY(-50%); }

    #clickToLock {
      position:absolute;
      left:50%; top:12px;
      transform:translateX(-50%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      pointer-events:none;
      user-select:none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="clickToLock">кликни по экрану для управления мышью</div>
  <div id="crosshair"></div>
  <div id="subtitle">Ты заходишь в бар. Шум, смех, пиво.</div>

  <div id="ui">
    <div class="line">— Эй. Ты.\n— Сыграем?</div>
    <button class="choice" id="ch1">1) Подойти к незнакомцу</button>
    <button class="choice" id="ch2">2) Пойти пить пиво</button>
    <div id="hint">Нажми 1 или 2.</div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha:false });

  const ui = document.getElementById('ui');
  const subtitle = document.getElementById('subtitle');
  const ch1 = document.getElementById('ch1');
  const ch2 = document.getElementById('ch2');

  // ===== Настройки "дёшево как Doom" =====
  const INTERNAL_W = 320;   // внутренняя "пиксельная" ширина
  const INTERNAL_H = 180;   // внутренняя "пиксельная" высота
  const FOV = Math.PI / 3;  // ~60°
  const MAX_DIST = 30;

  // скорость
  const MOVE_SPEED = 2.8;    // units/sec
  const STRAFE_SPEED = 2.5;
  const TURN_SPEED = 2.2;    // rad/sec (стрелки)
  const MOUSE_SENS = 0.0023;

  // ===== Локация (бар) =====
  // 0 = пусто
  // 1 = стена
  // 2 = стойка (бар)
  //
  // Делай коридор/зал: стены по краям, внизу "стойка" вдоль стены (не в центре)

  const MAP_W = 26;
  const MAP_H = 14;

  // Простая "комната" + стойка вдоль нижней стены
  // Важно: стойка не должна образовывать "моноблок в центре"
  const map = [
    "11111111111111111111111111",
    "10000000000000000000000001",
    "10000000000000000000000001",
    "10000000000000000000000001",
    "10000000000000000000000001",
    "10000000000000000000000001",
    "10000000000000000000000001",
    "10000000000000000000000001",
    "10000000000000000000000001",
    "10000000000000000000000001",
    "10000000000000000000000001",
    // стойка вдоль нижней стены, по центру (типо барная зона)
    "10000000000222222220000001",
    "10000000000000000000000001",
    "11111111111111111111111111",
  ].map(r => r.split("").map(n => +n));

  function cell(x,y){
    const ix = Math.floor(x);
    const iy = Math.floor(y);
    if (ix<0||iy<0||ix>=MAP_W||iy>=MAP_H) return 1;
    return map[iy][ix];
  }

  // Игрок
  const player = {
    x: 3.5,
    y: 10.5,
    a: 0, // угол (0 = вправо по карте)
    vx: 0, vy: 0
  };

  // Точка "куда подходить" перед стойкой (СПЕРЕДИ)
  // Стойка у нас в строке y=11 (0-index), поэтому "перед ней" — y ~ 10.2-10.6
  const BAR_FRONT = {
    // центр перед стойкой
    x: 13.0,
    y: 10.45,
    // нормаль "куда смотрит стойка спереди" (стойка ниже -> фронт сверху, значит нормаль вверх по карте = -Y)
    nx: 0,
    ny: -1,
    // насколько близко надо подойти чтобы сработало (2-3 шага)
    dist: 1.35,
    // доп. условие: игрок должен быть "спереди", а не сбоку
    // угол между взглядом игрока и нормалью стойки
    facingDot: 0.65
  };

  // "Незнакомец" — просто точка, куда поворачиваемся (слева от игрока относительно стойки)
  const STRANGER = { x: 9.0, y: 8.2 };

  // Состояния
  const state = {
    locked: false,     // pointer lock
    freeze: false,     // блок управления
    triggered: false,  // был ли триггер
    autoTurning: false,
    autoTargetAngle: 0,
    autoMove: false,
    autoMoveTarget: { x: BAR_FRONT.x, y: BAR_FRONT.y }
  };

  // ===== Ресайз =====
  function resize(){
    canvas.width = INTERNAL_W;
    canvas.height = INTERNAL_H;
  }
  resize();
  window.addEventListener('resize', resize);

  // ===== Управление =====
  const keys = {};
  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;

    if (ui.style.display === 'block') {
      if (e.code === 'Digit1') choose(1);
      if (e.code === 'Digit2') choose(2);
    }
  });
  window.addEventListener('keyup', (e) => keys[e.code] = false);

  // pointer lock
  document.addEventListener('click', () => {
    if (!state.locked) canvas.requestPointerLock?.();
  });
  document.addEventListener('pointerlockchange', () => {
    state.locked = (document.pointerLockElement === canvas);
  });
  document.addEventListener('mousemove', (e) => {
    if (!state.locked || state.freeze) return;
    player.a += e.movementX * MOUSE_SENS;
  });

  // ===== Математика =====
  function clampAngle(a){
    while (a < -Math.PI) a += Math.PI*2;
    while (a >  Math.PI) a -= Math.PI*2;
    return a;
  }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function dist(ax,ay,bx,by){
    const dx=ax-bx, dy=ay-by;
    return Math.hypot(dx,dy);
  }
  function normalize(dx,dy){
    const l = Math.hypot(dx,dy) || 1;
    return {x:dx/l, y:dy/l};
  }

  // ===== Коллизии =====
  function tryMove(nx, ny){
    // маленький радиус игрока
    const r = 0.18;

    // по X
    if (cell(nx + Math.sign(nx-player.x)*r, player.y) === 0) player.x = nx;
    // по Y
    if (cell(player.x, ny + Math.sign(ny-player.y)*r) === 0) player.y = ny;
  }

  // ===== Raycast (DDA) =====
  function castRay(rx, ry, rdx, rdy){
    // DDA по сетке
    let mapX = Math.floor(rx);
    let mapY = Math.floor(ry);

    const deltaDistX = Math.abs(1 / (rdx || 1e-9));
    const deltaDistY = Math.abs(1 / (rdy || 1e-9));

    let stepX, sideDistX;
    if (rdx < 0) { stepX = -1; sideDistX = (rx - mapX) * deltaDistX; }
    else { stepX = 1; sideDistX = (mapX + 1.0 - rx) * deltaDistX; }

    let stepY, sideDistY;
    if (rdy < 0) { stepY = -1; sideDistY = (ry - mapY) * deltaDistY; }
    else { stepY = 1; sideDistY = (mapY + 1.0 - ry) * deltaDistY; }

    let hit = 0;
    let side = 0; // 0 x, 1 y
    let iterations = 0;

    while (!hit && iterations++ < 200) {
      if (sideDistX < sideDistY) {
        sideDistX += deltaDistX;
        mapX += stepX;
        side = 0;
      } else {
        sideDistY += deltaDistY;
        mapY += stepY;
        side = 1;
      }

      if (mapX<0||mapY<0||mapX>=MAP_W||mapY>=MAP_H) { hit = 1; break; }
      const v = map[mapY][mapX];
      if (v !== 0) hit = v;
    }

    let perpWallDist;
    if (side === 0) perpWallDist = (sideDistX - deltaDistX);
    else perpWallDist = (sideDistY - deltaDistY);

    perpWallDist = Math.min(perpWallDist, MAX_DIST);

    return { dist: perpWallDist, hit, side };
  }

  // ===== Триггер стойки (ТОЛЬКО СПЕРЕДИ) =====
  function checkBarTrigger(){
    if (state.triggered) return;

    const d = dist(player.x, player.y, BAR_FRONT.x, BAR_FRONT.y);
    if (d > BAR_FRONT.dist) return;

    // проверка "спереди": игрок должен быть выше стойки (y меньше стойки)
    // + должен смотреть примерно в сторону стойки (вниз по карте, то есть +Y),
    // но мы используем нормаль стойки (0,-1) и берём dot со взглядом на нормаль со знаком минус.
    const look = { x: Math.cos(player.a), y: Math.sin(player.a) };

    // игрок должен смотреть примерно НА стойку: то есть в направлении +Y (к низу карты)
    // нормаль стойки направлена -Y, поэтому "взгляд на стойку" ~= -normal = (0,+1)
    const toBarNormal = { x: -BAR_FRONT.nx, y: -BAR_FRONT.ny };
    const dot = look.x*toBarNormal.x + look.y*toBarNormal.y;

    // и ещё: игрок должен быть примерно по центру, не сбоку
    const dx = player.x - BAR_FRONT.x;
    if (Math.abs(dx) > 1.25) return;

    if (dot < BAR_FRONT.facingDot) return;

    // сработало
    state.triggered = true;
    state.freeze = true;

    // авто-поворот к незнакомцу (влево от стойки)
    const ang = Math.atan2(STRANGER.y - player.y, STRANGER.x - player.x);
    state.autoTargetAngle = ang;
    state.autoTurning = true;

    subtitle.textContent = "Кто-то окликает тебя из угла...";
    // покажем UI чуть позже, чтобы поворот успел начаться
    setTimeout(() => {
      ui.style.display = 'block';
    }, 250);
  }

  function choose(n){
    ui.style.display = 'none';
    if (n === 1){
      subtitle.textContent = "Ты подходишь к незнакомцу...";
      // тут потом сделаем автопереход к столу / катсцену
    } else {
      subtitle.textContent = "Иногда лучший выбор — не играть.";
      // тут потом конец/рестарт
    }
  }
  ch1.addEventListener('click', () => choose(1));
  ch2.addEventListener('click', () => choose(2));

  // ===== Обновление =====
  let last = performance.now();
  function tick(now){
    const dt = Math.min(0.033, (now-last)/1000);
    last = now;

    // авто-поворот (плавно)
    if (state.autoTurning){
      let da = clampAngle(state.autoTargetAngle - player.a);
      const step = 2.4 * dt; // скорость автоповорота
      if (Math.abs(da) < 0.02){
        player.a = state.autoTargetAngle;
        state.autoTurning = false;
        // остаёмся заморожены пока UI открыт
      } else {
        player.a += Math.sign(da) * Math.min(Math.abs(da), step);
      }
    }

    // управление только если не freeze
    if (!state.freeze){
      let forward = 0;
      let strafe = 0;

      if (keys['KeyW']) forward += 1;
      if (keys['KeyS']) forward -= 1;
      if (keys['KeyD']) strafe  += 1;
      if (keys['KeyA']) strafe  -= 1;

      // поворот стрелками
      if (keys['ArrowLeft'])  player.a -= TURN_SPEED * dt;
      if (keys['ArrowRight']) player.a += TURN_SPEED * dt;

      const ca = Math.cos(player.a);
      const sa = Math.sin(player.a);

      const vx = ca * forward * MOVE_SPEED + (-sa) * strafe * STRAFE_SPEED;
      const vy = sa * forward * MOVE_SPEED + ( ca) * strafe * STRAFE_SPEED;

      const nx = player.x + vx * dt;
      const ny = player.y + vy * dt;

      // коллизии с стенами (1) и стойкой (2)
      // считаем 2 как стену для движения
      const oldCell = cell(nx, player.y);
      const oldCell2 = cell(player.x, ny);
      const blockedX = (oldCell === 1 || oldCell === 2);
      const blockedY = (oldCell2 === 1 || oldCell2 === 2);

      const r = 0.18;
      // мягкая проверка по радиусу
      function solidAt(x,y){
        const v = cell(x,y);
        return (v === 1 || v === 2);
      }
      // X
      if (!solidAt(nx + Math.sign(nx-player.x)*r, player.y)) player.x = nx;
      // Y
      if (!solidAt(player.x, ny + Math.sign(ny-player.y)*r)) player.y = ny;

      checkBarTrigger();
    } else {
      // если UI закрыли — разморозить
      if (ui.style.display !== 'block' && !state.autoTurning){
        state.freeze = false;
      }
    }

    render();
    requestAnimationFrame(tick);
  }

  // ===== Рендер =====
  function render(){
    // очистка
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,INTERNAL_W,INTERNAL_H);

    // потолок/пол (плоские)
    ctx.fillStyle = '#0a0a0a'; // потолок
    ctx.fillRect(0,0,INTERNAL_W,INTERNAL_H/2);
    ctx.fillStyle = '#050505'; // пол
    ctx.fillRect(0,INTERNAL_H/2,INTERNAL_W,INTERNAL_H/2);

    // лучи
    for (let x = 0; x < INTERNAL_W; x++){
      const cameraX = (2 * x / INTERNAL_W) - 1;
      const rayAngle = player.a + Math.atan(cameraX * Math.tan(FOV/2));
      const rdx = Math.cos(rayAngle);
      const rdy = Math.sin(rayAngle);

      const hit = castRay(player.x, player.y, rdx, rdy);

      let d = hit.dist;
      // fish-eye correction
      d *= Math.cos(rayAngle - player.a);

      const wallH = Math.min(INTERNAL_H, (INTERNAL_H / (d + 0.0001)) * 1.05);
      const y0 = (INTERNAL_H - wallH) / 2;

      // цвет стен
      let col;
      if (hit.hit === 2) col = '#3a3a3a';  // стойка чуть темнее
      else col = '#666';                  // стены
      if (hit.side === 1) col = (hit.hit === 2) ? '#333' : '#5b5b5b'; // затемнение по стороне

      // туман по дистанции
      const fog = Math.min(1, d / 14);
      ctx.fillStyle = shade(col, fog);

      ctx.fillRect(x, y0, 1, wallH);
    }
  }

  function shade(hex, t){
    // hex вида #rrggbb
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    const k = 1 - t*0.65;
    const rr = Math.max(0, Math.floor(r*k));
    const gg = Math.max(0, Math.floor(g*k));
    const bb = Math.max(0, Math.floor(b*k));
    return `rgb(${rr},${gg},${bb})`;
  }

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
