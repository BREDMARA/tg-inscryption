<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bar — Prologue</title>
  <style>
    html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; }
    canvas { width:100%; height:100%; image-rendering:pixelated; display:block; }

    #subtitle{
      position:absolute; left:0; right:0; bottom:18px;
      text-align:center; color:#d8d8d8; font-family:serif;
      text-shadow:0 0 8px #000; pointer-events:none; padding:0 16px;
      user-select:none; line-height:1.35; opacity:0.95;
    }

    #overlay{
      position:absolute; inset:0; display:none;
      align-items:center; justify-content:center;
      background:rgba(0,0,0,0.55);
      color:#d8d8d8; font-family:serif; text-shadow:0 0 8px #000;
      padding:24px;
    }
    #panel{
      width:min(780px, calc(100vw - 32px));
      padding:18px;
      border:1px solid rgba(255,255,255,0.15);
      background:rgba(0,0,0,0.45);
    }
    .title{ margin:0 0 10px; font-size:18px; opacity:0.95; }
    .choice{
      margin-top:10px; padding:10px 12px;
      border:1px solid rgba(255,255,255,0.22);
      background:rgba(255,255,255,0.04);
      cursor:pointer; user-select:none;
    }
    .choice:hover{ background:rgba(255,255,255,0.08); }
    .hint{ margin-top:10px; opacity:0.75; font-size:13px; }
  </style>
</head>
<body>

<canvas id="game"></canvas>
<div id="subtitle">Ты заходишь в бар. Шум, смех, пиво.</div>

<div id="overlay">
  <div id="panel"></div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const subtitle = document.getElementById("subtitle");
const overlay = document.getElementById("overlay");
const panel = document.getElementById("panel");

function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener("resize", resize);
resize();

/*
  Карта 8x8:
  1 = стена
  0 = пусто
  2 = стойка (видимая и "твердая")
*/
const map = [
  "11111111",
  "10022001",
  "10000001",
  "10000001",
  "10000001",
  "10000001",
  "10000001",
  "11111111"
];

let px = 4.0;
let py = 6.0;
let pa = -Math.PI/2;

const STATE = {
  PLAY: "play",
  AUTO: "auto",
  TURN: "turn",
  DIALOG: "dialog",
};
let state = STATE.PLAY;

let triggered = false;

// 🎭 точки мира
const BAR = { x: 4.0, y: 1.2 };        // центр стойки
const STRANGER = { x: 1.6, y: 2.0 };   // "угол" незнакомца

// точки, куда автоподводим игрока
const BAR_APPROACH = { x: BAR.x, y: BAR.y + 1.25 };          // перед стойкой
const STRANGER_APPROACH = { x: STRANGER.x + 1.0, y: STRANGER.y + 0.9 }; // рядом с незнакомцем (в проходе)

// авто-цель (меняется по событиям)
let autoTarget = { x: BAR_APPROACH.x, y: BAR_APPROACH.y };
let targetAngle = pa;

function isBlockChar(ch){ return (ch === "1" || ch === "2"); }

function isWall(x,y){
  const mx = Math.floor(x), my = Math.floor(y);
  if (my<0||my>=map.length||mx<0||mx>=map[0].length) return true;
  return isBlockChar(map[my][mx]);
}

const keys = {};
addEventListener("keydown", (e) => {
  keys[e.code] = true;

  if (state === STATE.DIALOG){
    if (e.code === "Digit1") choose(1);
    if (e.code === "Digit2") choose(2);
  }
});
addEventListener("keyup", e => keys[e.code]=false);

function lerpAngle(a,b,t){
  let d = b - a;
  while (d > Math.PI) d -= Math.PI*2;
  while (d < -Math.PI) d += Math.PI*2;
  return a + d*t;
}

function angleDiff(a, b){
  let d = b - a;
  while (d > Math.PI) d -= Math.PI*2;
  while (d < -Math.PI) d += Math.PI*2;
  return Math.abs(d);
}

// ✅ ТРИГГЕР: только если ты подошёл СПЕРЕДИ и смотришь на стойку
function nearBarCounter(){
  const dx = BAR.x - px;
  const dy = BAR.y - py;
  const dist = Math.hypot(dx, dy);

  const lookToBar = Math.atan2(dy, dx);
  const diff = angleDiff(pa, lookToBar);

  const DIST_TRIGGER = 1.75;
  const VIEW_CONE = 0.55;
  const inFront = py > BAR.y + 0.6;

  return dist < DIST_TRIGGER && diff < VIEW_CONE && inFront;
}

function openOverlay(){
  panel.innerHTML = `
    <div class="title">— Эй. Ты.<br>— Сыграем?</div>
    <div class="choice" data-c="1">1) Подойти к незнакомцу</div>
    <div class="choice" data-c="2">2) Пойти пить пиво</div>
    <div class="hint">Нажми 1 или 2.</div>
  `;
  overlay.style.display = "flex";

  panel.querySelectorAll(".choice").forEach(el=>{
    el.addEventListener("click", ()=> choose(Number(el.dataset.c)));
  });
}

function closeOverlay(){ overlay.style.display = "none"; }

// ✅ автодвижение (со скольжением по стенам)
function autoMoveToPoint(dt, tx, ty){
  const dx = tx - px;
  const dy = ty - py;
  const dist = Math.hypot(dx, dy);

  if (dist < 0.10) return true;

  const wantA = Math.atan2(dy, dx);
  pa = lerpAngle(pa, wantA, dt*6.0);

  const speed = 1.9;
  const step = Math.min(speed*dt, dist);

  const sx = Math.cos(wantA) * step;
  const sy = Math.sin(wantA) * step;

  // X отдельно
  let nx = px + sx;
  if (!isWall(nx, py)) px = nx;
  else {
    nx = px + sx*0.2;
    if (!isWall(nx, py)) px = nx;
  }

  // Y отдельно
  let ny = py + sy;
  if (!isWall(px, ny)) py = ny;
  else {
    ny = py + sy*0.2;
    if (!isWall(px, ny)) py = ny;
  }

  return false;
}

function choose(n){
  closeOverlay();

  if (n === 1){
    // ✅ ВОТ ТУТ БЫЛА ПРОБЛЕМА: раньше тут не было движения вообще
    subtitle.textContent = "Ты подходишь к незнакомцу...";
    state = STATE.AUTO;
    autoTarget = { x: STRANGER_APPROACH.x, y: STRANGER_APPROACH.y };
    // после подхода — повернуться на незнакомца
    targetAngle = Math.atan2(STRANGER.y - py, STRANGER.x - px);
  } else {
    subtitle.textContent = "Ты идёшь пить пиво. Иногда лучший выбор — не играть.";
    // можно потом сделать «конец»/кнопку «заново», пока просто оставим
  }
}

function update(dt){
  const move = 3.0*dt;
  const rot  = 1.7*dt;

  if (state === STATE.PLAY){
    if (keys["KeyW"] || keys["ArrowUp"]){
      const nx = px + Math.cos(pa)*move;
      const ny = py + Math.sin(pa)*move;
      if (!isWall(nx,ny)) { px = nx; py = ny; }
    }
    if (keys["KeyS"] || keys["ArrowDown"]){
      const nx = px - Math.cos(pa)*move;
      const ny = py - Math.sin(pa)*move;
      if (!isWall(nx,ny)) { px = nx; py = ny; }
    }
    if (keys["KeyA"] || keys["ArrowLeft"])  pa -= rot;
    if (keys["KeyD"] || keys["ArrowRight"]) pa += rot;

    if (!triggered && nearBarCounter()){
      triggered = true;

      // 1) автоподвести к стойке
      subtitle.textContent = "Ты подходишь ближе к стойке...";
      state = STATE.AUTO;
      autoTarget = { x: BAR_APPROACH.x, y: BAR_APPROACH.y };
      // после авто-подхода мы повернемся (в STATE.TURN) на незнакомца
      targetAngle = Math.atan2(STRANGER.y - py, STRANGER.x - px);
    }
  }

  // ✅ авто-движение к текущей цели
  if (state === STATE.AUTO){
    const arrived = autoMoveToPoint(dt, autoTarget.x, autoTarget.y);
    if (arrived){
      state = STATE.TURN;
      // targetAngle уже выставлен (либо на незнакомца после стойки, либо после выбора 1)
    }
  }

  // ✅ поворот камеры к targetAngle
  if (state === STATE.TURN){
    pa = lerpAngle(pa, targetAngle, dt*3.2);
    if (angleDiff(pa, targetAngle) < 0.02){
      // если это поворот после стойки — показать диалог
      // если это поворот после подхода к незнакомцу — просто оставить и дальше продолжим сцену позже
      if (overlay.style.display !== "flex" && !panel.innerHTML){
        // ничего
      }

      // если мы ещё не показывали выбор — показываем
      if (overlay.style.display !== "flex" && panel.innerHTML === ""){
        subtitle.textContent = "Кто-то окликает тебя из угла...";
        state = STATE.DIALOG;
        openOverlay();
      } else {
        // после выбора 1 мы сюда попадём без открытия окна — пусть игрок постоит лицом к незнакомцу
        state = STATE.PLAY;
      }
    }
  }

  // когда диалог открыт — игрок не ходит
  if (state === STATE.DIALOG){
    // ничего
  }
}

function render(){
  const w = canvas.width, h = canvas.height;

  ctx.fillStyle = "#0f0f0f";
  ctx.fillRect(0,0,w,h/2);
  ctx.fillStyle = "#050505";
  ctx.fillRect(0,h/2,w,h/2);

  for (let x=0; x<w; x++){
    const angle = pa + (x/w - 0.5);
    let dist = 0;
    let hitChar = "0";

    while (dist < 20){
      const rx = px + Math.cos(angle)*dist;
      const ry = py + Math.sin(angle)*dist;

      const mx = Math.floor(rx), my = Math.floor(ry);
      if (my<0||my>=map.length||mx<0||mx>=map[0].length){ hitChar="1"; break; }

      const cell = map[my][mx];
      if (isBlockChar(cell)){ hitChar = cell; break; }

      dist += 0.04;
    }

    if (dist < 0.35) dist = 0.35;

    const wallH = h/(dist+0.1);

    let shade = 185 - dist*12;
    shade = Math.max(40, Math.min(200, shade));
    if (hitChar === "2") shade = Math.max(35, shade - 25);

    ctx.fillStyle = `rgb(${shade},${shade},${shade})`;
    ctx.fillRect(x, h/2 - wallH/2, 1, wallH);
  }

  // крестик-прицел
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  ctx.fillRect(w/2 - 6, h/2, 12, 1);
  ctx.fillRect(w/2, h/2 - 6, 1, 12);
}

let last = performance.now();
function loop(t){
  const dt = (t-last)/1000;
  last = t;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
loop(last);
</script>

</body>
</html>
