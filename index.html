<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bar — Prologue</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      display: block;
    }
    #subtitle {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: #d8d8d8;
      font-family: serif;
      text-shadow: 0 0 8px black;
      pointer-events: none;
    }
  </style>
</head>
<body>

<canvas id="game"></canvas>
<div id="subtitle">Ты заходишь в бар. Шум, смех, пиво.</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const subtitle = document.getElementById("subtitle");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// КОМПАКТНАЯ ЛОКАЦИЯ БАРА (8x8)
const map = [
  "11111111",
  "10000001",
  "10011001",
  "10010001",
  "10011001",
  "10000001",
  "10000001",
  "11111111"
];

// старт ближе к входу
let px = 2.5, py = 5.5;
let pa = -Math.PI / 2;

function isWall(x, y) {
  const mx = Math.floor(x);
  const my = Math.floor(y);
  if (my < 0 || my >= map.length || mx < 0 || mx >= map[0].length) return true;
  return map[my][mx] === "1";
}

// управление без зависимости от раскладки
const keys = {};
window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

function update(dt) {
  const moveSpeed = 3.0 * dt;
  const rotSpeed = 1.7 * dt;

  // вперёд
  if (keys["KeyW"] || keys["ArrowUp"]) {
    const nx = px + Math.cos(pa) * moveSpeed;
    const ny = py + Math.sin(pa) * moveSpeed;
    if (!isWall(nx, ny)) { px = nx; py = ny; }
  }

  // назад
  if (keys["KeyS"] || keys["ArrowDown"]) {
    const nx = px - Math.cos(pa) * moveSpeed;
    const ny = py - Math.sin(pa) * moveSpeed;
    if (!isWall(nx, ny)) { px = nx; py = ny; }
  }

  // поворот
  if (keys["KeyA"] || keys["ArrowLeft"]) pa -= rotSpeed;
  if (keys["KeyD"] || keys["ArrowRight"]) pa += rotSpeed;
}

// рендер Doom-style
function render() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let x = 0; x < canvas.width; x++) {
    const rayAngle = pa + (x / canvas.width - 0.5);
    let dist = 0;

    while (dist < 20) {
      const rx = px + Math.cos(rayAngle) * dist;
      const ry = py + Math.sin(rayAngle) * dist;
      if (isWall(rx, ry)) break;
      dist += 0.04;
    }

    const wallHeight = canvas.height / (dist + 0.1);
    const shade = Math.max(0, 160 - dist * 12);

    ctx.fillStyle = `rgb(${shade},${shade},${shade})`;
    ctx.fillRect(
      x,
      canvas.height / 2 - wallHeight / 2,
      1,
      wallHeight
    );
  }
}

let last = performance.now();
function loop(now) {
  const dt = (now - last) / 1000;
  last = now;

  update(dt);
  render();

  requestAnimationFrame(loop);
}
loop(last);
</script>

</body>
</html>
