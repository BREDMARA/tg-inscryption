<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bar — Prologue</title>
  <style>
    html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; }
    canvas { width:100%; height:100%; image-rendering:pixelated; display:block; }

    #subtitle{
      position:absolute; left:0; right:0; bottom:18px;
      text-align:center; color:#d8d8d8; font-family:serif;
      text-shadow:0 0 8px #000; pointer-events:none; padding:0 16px;
      user-select:none; line-height:1.35;
    }

    #overlay{
      position:absolute; inset:0; display:none;
      align-items:center; justify-content:center;
      background:rgba(0,0,0,0.55);
      color:#d8d8d8; font-family:serif; text-shadow:0 0 8px #000;
      padding:24px;
    }
    #panel{
      width:min(780px, calc(100vw - 32px));
      padding:18px;
      border:1px solid rgba(255,255,255,0.15);
      background:rgba(0,0,0,0.45);
    }
    .title{ margin:0 0 10px; font-size:18px; opacity:0.95; }
    .choice{
      margin-top:10px; padding:10px 12px;
      border:1px solid rgba(255,255,255,0.22);
      background:rgba(255,255,255,0.04);
      cursor:pointer; user-select:none;
    }
    .choice:hover{ background:rgba(255,255,255,0.08); }
    .hint{ margin-top:10px; opacity:0.75; font-size:13px; }
  </style>
</head>
<body>

<canvas id="game"></canvas>
<div id="subtitle">Ты заходишь в бар. Шум, смех, пиво.</div>

<div id="overlay">
  <div id="panel"></div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const subtitle = document.getElementById("subtitle");
const overlay = document.getElementById("overlay");
const panel = document.getElementById("panel");

function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener("resize", resize);
resize();

const map = [
  "11111111",
  "10011001", // стойка
  "10000001",
  "10000001",
  "10000001",
  "10000001",
  "10000001",
  "11111111"
];

let px = 4.0;
let py = 5.5;
let pa = -Math.PI/2;

const STATE = { PLAY:"play", TURN:"turn", DIALOG:"dialog" };
let state = STATE.PLAY;

let triggered = false;
let targetAngle = pa;

/* 🔥 ОБНОВЛЁННЫЙ ТРИГГЕР
   Срабатывает за 2–3 шага до стойки */
function nearBarCounter(){
  return (
    py < 3.6 &&        // раньше, чем вплотную
    px > 3.0 &&
    px < 5.0
  );
}

function isWall(x,y){
  const mx = Math.floor(x), my = Math.floor(y);
  if (my<0||my>=map.length||mx<0||mx>=map[0].length) return true;
  return map[my][mx] === "1";
}

const keys = {};
addEventListener("keydown", e => keys[e.code]=true);
addEventListener("keyup", e => keys[e.code]=false);

function lerpAngle(a,b,t){
  let d = b - a;
  while (d > Math.PI) d -= Math.PI*2;
  while (d < -Math.PI) d += Math.PI*2;
  return a + d*t;
}

function openOverlay(){
  panel.innerHTML = `
    <div class="title">— Эй. Ты.<br>— Сыграем?</div>
    <div class="choice">1) Подойти к незнакомцу</div>
    <div class="choice">2) Пойти пить пиво</div>
    <div class="hint">Нажми 1 или 2.</div>
  `;
  overlay.style.display = "flex";
}

function update(dt){
  const move = 3*dt;
  const rot = 1.7*dt;

  if (state === STATE.PLAY){
    if (keys["KeyW"] || keys["ArrowUp"]){
      const nx = px + Math.cos(pa)*move;
      const ny = py + Math.sin(pa)*move;
      if (!isWall(nx,ny)) { px = nx; py = ny; }
    }
    if (keys["KeyS"] || keys["ArrowDown"]){
      const nx = px - Math.cos(pa)*move;
      const ny = py - Math.sin(pa)*move;
      if (!isWall(nx,ny)) { px = nx; py = ny; }
    }
    if (keys["KeyA"] || keys["ArrowLeft"]) pa -= rot;
    if (keys["KeyD"] || keys["ArrowRight"]) pa += rot;

    if (!triggered && nearBarCounter()){
      triggered = true;
      state = STATE.TURN;

      // 🔥 ПОВОРОТ ВЛЕВО (режиссёрский)
      targetAngle = pa - 1.25;

      subtitle.textContent = "Кто-то окликает тебя из угла...";
    }
  }

  if (state === STATE.TURN){
    pa = lerpAngle(pa, targetAngle, dt*3);
    if (Math.abs(pa - targetAngle) < 0.02){
      state = STATE.DIALOG;
      openOverlay();
    }
  }
}

function render(){
  const w = canvas.width, h = canvas.height;

  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(0,0,w,h/2);
  ctx.fillStyle = "#070707";
  ctx.fillRect(0,h/2,w,h/2);

  for (let x=0; x<w; x++){
    const angle = pa + (x/w - 0.5);
    let dist = 0;
    while (dist < 20){
      const rx = px + Math.cos(angle)*dist;
      const ry = py + Math.sin(angle)*dist;
      if (isWall(rx,ry)) break;
      dist += 0.04;
    }
    if (dist < 0.35) dist = 0.35;

    const wallH = h/(dist+0.1);
    const shade = 180 - dist*12;
    ctx.fillStyle = `rgb(${shade},${shade},${shade})`;
    ctx.fillRect(x, h/2 - wallH/2, 1, wallH);
  }

  // прицел
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  ctx.fillRect(w/2 - 6, h/2, 12, 1);
  ctx.fillRect(w/2, h/2 - 6, 1, 12);
}

let last = performance.now();
function loop(t){
  const dt = (t-last)/1000;
  last = t;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
loop(last);
</script>

</body>
</html>
