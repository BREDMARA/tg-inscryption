<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bar — Prologue</title>
  <style>
    html, body { margin:0; padding:0; background:#000; height:100%; overflow:hidden; }
    canvas { width:100%; height:100%; image-rendering: pixelated; display:block; }

    /* Нормальный маленький прицел (НЕ пиксельный, а экранный) */
    #crosshair{
      position:absolute;
      left:50%; top:50%;
      width:18px; height:18px;
      transform:translate(-50%,-50%);
      pointer-events:none;
      opacity:.45;
    }
    #crosshair:before, #crosshair:after{
      content:"";
      position:absolute;
      left:50%; top:50%;
      background:#fff;
      transform:translate(-50%,-50%);
      box-shadow:0 0 10px rgba(0,0,0,.8);
    }
    #crosshair:before{ width:18px; height:2px; }
    #crosshair:after { width:2px;  height:18px; }

    #subtitle{
      position:absolute; left:0; right:0; bottom:18px;
      text-align:center; color:#d8d8d8; font-family: serif; font-size:16px;
      text-shadow:0 0 10px #000; pointer-events:none;
      opacity:.92; user-select:none; padding:0 12px; line-height:1.35;
    }

    #overlay{
      position:absolute; inset:0; display:none;
      align-items:center; justify-content:center;
      background:rgba(0,0,0,.35);
      padding:18px;
    }
    #panel{
      width:min(720px,92vw);
      border:1px solid rgba(255,255,255,.18);
      background:rgba(0,0,0,.45);
      padding:14px 14px 10px;
      color:#d8d8d8;
      font-family: serif;
      box-shadow:0 0 24px rgba(0,0,0,.6);
    }
    .title{ margin-bottom:10px; line-height:1.25; font-size:18px; }
    .choice{
      border:1px solid rgba(255,255,255,.14);
      padding:10px 10px;
      margin:8px 0;
      cursor:pointer;
      background:rgba(255,255,255,.04);
      user-select:none;
    }
    .choice:hover{ background:rgba(255,255,255,.08); }
    .hint{ opacity:.75; font-size:13px; margin-top:6px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="crosshair"></div>
  <div id="subtitle">Ты заходишь в бар. Шум, смех, пиво.</div>

  <div id="overlay"><div id="panel"></div></div>

<script>
(() => {
  // =========================
  // CANVAS / ретро буфер
  // =========================
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const overlay = document.getElementById('overlay');
  const panel   = document.getElementById('panel');
  const subtitle = document.getElementById('subtitle');

  // Ретро-буфер (как было у тебя “нормально”)
  const W = 240, H = 135;
  canvas.width = W;
  canvas.height = H;

  // =========================
  // МИР (бар)
  // =========================
  const MAP_W = 24, MAP_H = 16;

  // карта с периметром
  const map = Array.from({length: MAP_H}, (_,y)=>
    Array.from({length: MAP_W}, (_,x)=>
      (x===0||y===0||x===MAP_W-1||y===MAP_H-1) ? 1 : 0
    )
  );

  // стойка вдоль "верхней" стены (примерно по центру)
  // (Если у тебя стойка уже была идеальная — скажи, подвинем числа)
  const BAR = { x: 8.0, y: 3.2, w: 8.0, h: 0.9 };

  // незнакомец слева у стены
  const STRANGER = { x: 3.0, y: 3.0 };
  // точка "стола" — куда автоподход должен довести
  const TABLE = { x: 4.0, y: 4.2 };

  // игрок старт
  let px = 12.0, py = 12.2;
  let pa = -Math.PI/2;

  // =========================
  // STATE
  // =========================
  const STATE = {
    PLAY:"play",
    TURN_TO_STRANGER:"turn_to_stranger",
    DIALOG1:"dialog1",
    AUTO_WALK:"auto_walk",
    DIALOG2:"dialog2",
    END:"end"
  };
  let state = STATE.PLAY;

  let triggerFired = false;

  // =========================
  // COLLISION
  // =========================
  function isWall(x,y){
    const xi = Math.floor(x), yi = Math.floor(y);
    if (xi<0||yi<0||xi>=MAP_W||yi>=MAP_H) return true;
    if (map[yi][xi] === 1) return true;

    // стойка — коллизия
    if (x >= BAR.x && x <= BAR.x+BAR.w && y >= BAR.y && y <= BAR.y+BAR.h) return true;
    return false;
  }

  // =========================
  // RAYCAST
  // =========================
  function castRay(angle){
    const dx = Math.cos(angle), dy = Math.sin(angle);
    let x = px, y = py;
    let dist = 0;
    const step = 0.03;
    for (let i=0;i<2200;i++){
      x += dx*step; y += dy*step; dist += step;
      if (isWall(x,y)) break;
    }
    return dist;
  }

  // =========================
  // ANGLES
  // =========================
  function lerpAngle(a,b,t){
    let d = ((b - a + Math.PI*3) % (Math.PI*2)) - Math.PI;
    t = Math.min(1, Math.max(0, t));
    return a + d*t;
  }

  // =========================
  // TRIGGER: только СПЕРЕДИ стойки
  // =========================
  function checkBarFrontTrigger(){
    if (triggerFired) return false;

    // зона прямо перед стойкой (только спереди)
    const frontZone = {
      x: BAR.x + 0.4,
      y: BAR.y + BAR.h + 0.15,
      w: BAR.w - 0.8,
      h: 0.85
    };

    const inside =
      px >= frontZone.x && px <= frontZone.x + frontZone.w &&
      py >= frontZone.y && py <= frontZone.y + frontZone.h;

    return inside;
  }

  function startBarTrigger(){
    triggerFired = true;
    subtitle.textContent = "Кто-то окликает тебя из угла...";
    state = STATE.TURN_TO_STRANGER;

    // через чуть-чуть показываем диалог (как катсцена)
    setTimeout(() => {
      state = STATE.DIALOG1;
      openOverlay1();
    }, 500);
  }

  // =========================
  // UI
  // =========================
  function openOverlay1(){
    panel.innerHTML = `
      <div class="title">— Эй. Ты.<br>— Сыграем?</div>
      <div class="choice" data-n="1">1) Подойти к незнакомцу</div>
      <div class="choice" data-n="2">2) Пойти пить пиво</div>
      <div class="hint">Нажми 1 или 2.</div>
    `;
    overlay.style.display = "flex";
    panel.querySelectorAll(".choice").forEach(el=>{
      el.addEventListener("click", ()=> choose1(Number(el.dataset.n)));
    });
  }

  function openOverlay2(){
    panel.innerHTML = `
      <div class="title">
        Незнакомец наклоняется ближе:<br>
        — Мы играем на твою душу. — ВУХАХАХА—<br><br>
        Он резко начинает кашлять. Давится.
      </div>
      <div class="choice" data-c="1">1) Помочь ему</div>
      <div class="choice" data-c="2">2) Ничего не делать</div>
      <div class="hint">Нажми 1 или 2.</div>
    `;
    overlay.style.display = "flex";
    panel.querySelectorAll(".choice").forEach(el=>{
      el.addEventListener("click", ()=> choose2(Number(el.dataset.c)));
    });
  }

  function openEnd(text){
    panel.innerHTML = `
      <div class="title">${text}</div>
      <div class="choice" id="restart">Начать заново</div>
    `;
    overlay.style.display = "flex";
    document.getElementById("restart").onclick = () => location.reload();
  }

  function closeOverlay(){ overlay.style.display = "none"; }

  function choose1(n){
    if (n === 1){
      closeOverlay();
      subtitle.textContent = "Ты подходишь к незнакомцу...";
      state = STATE.AUTO_WALK; // ✅ автоподход
    } else {
      closeOverlay();
      state = STATE.END;
      openEnd("Ты садишься к стойке. Пьёшь. Мир не меняется.<br><br>Иногда лучший выбор — не играть.");
    }
  }

  function choose2(n){
    closeOverlay();
    if (n === 1){
      subtitle.textContent = "Ты хлопаешь его по спине. Он откашливается...";
      setTimeout(()=>{
        subtitle.textContent = "— Ладно. Это было неловко. Если выиграешь — куплю тебе пиво.";
      }, 900);
      state = STATE.PLAY;
    } else {
      state = STATE.END;
      openEnd("Незнакомец падает. Крик. Стража.<br><br>Свидетели сказали, что ты сидел напротив.<br><br>Ты в тюрьме. Игра заканчивается.");
    }
  }

  // =========================
  // INPUT
  // =========================
  const keys = {};
  window.addEventListener('keydown', (e)=>{
    keys[e.code] = true;

    if (overlay.style.display === "flex"){
      if (state === STATE.DIALOG1){
        if (e.code === "Digit1") choose1(1);
        if (e.code === "Digit2") choose1(2);
      }
      if (state === STATE.DIALOG2){
        if (e.code === "Digit1") choose2(1);
        if (e.code === "Digit2") choose2(2);
      }
    }
  });
  window.addEventListener('keyup', (e)=> keys[e.code] = false);

  // =========================
  // AUTO WALK (после выбора "Подойти")
  // =========================
  function updateAuto(dt){
    const ax = TABLE.x - px;
    const ay = TABLE.y - py;

    const want = Math.atan2(ay, ax);
    pa = lerpAngle(pa, want, dt*4.0);

    const speed = 1.7;
    const step = speed*dt;

    const nx = px + Math.cos(pa)*step;
    const ny = py + Math.sin(pa)*step;
    if (!isWall(nx, ny)) { px = nx; py = ny; }

    if (Math.hypot(ax, ay) < 0.85){
      state = STATE.DIALOG2;
      openOverlay2();
    }
  }

  // =========================
  // UPDATE
  // =========================
  function update(dt){
    // триггер у стойки
    if (state === STATE.PLAY && checkBarFrontTrigger()){
      startBarTrigger();
    }

    // поворот к незнакомцу во время триггера (просто камера, без движения)
    if (state === STATE.TURN_TO_STRANGER){
      const target = Math.atan2(STRANGER.y - py, STRANGER.x - px);
      pa = lerpAngle(pa, target, dt*2.5);
      return;
    }

    // авто-ходьба
    if (state === STATE.AUTO_WALK){
      updateAuto(dt);
      return;
    }

    // если оверлей — не двигаем
    if (overlay.style.display === "flex") return;

    if (state !== STATE.PLAY) return;

    // управление
    let rot = 0;
    if (keys["ArrowLeft"] || keys["KeyA"]) rot -= 1;
    if (keys["ArrowRight"] || keys["KeyD"]) rot += 1;
    pa += rot * dt * 2.0;

    let move = 0;
    if (keys["ArrowUp"] || keys["KeyW"]) move += 1;
    if (keys["ArrowDown"] || keys["KeyS"]) move -= 1;

    const speed = 2.3;
    const nx = px + Math.cos(pa) * move * speed * dt;
    const ny = py + Math.sin(pa) * move * speed * dt;

    if (!isWall(nx, py)) px = nx;
    if (!isWall(px, ny)) py = ny;
  }

  // =========================
  // RENDER (думчик)
  // =========================
  function render(){
    ctx.fillStyle = "#060606";
    ctx.fillRect(0,0,W,H/2);
    ctx.fillStyle = "#020202";
    ctx.fillRect(0,H/2,W,H/2);

    const fov = Math.PI/3;

    for (let x=0;x<W;x++){
      const a = pa - fov/2 + (x/(W-1))*fov;
      const d = castRay(a);
      const dd = Math.max(0.001, d*Math.cos(a-pa));

      const wh = Math.min(H, (H*0.95) / dd);
      const shade = Math.max(40, 220 - dd*38);
      ctx.fillStyle = `rgb(${shade|0},${shade|0},${shade|0})`;
      ctx.fillRect(x, (H-wh)/2, 1, wh);
    }
  }

  // =========================
  // LOOP
  // =========================
  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.04, (now-last)/1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
